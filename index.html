<!doctype html>
<html class="bg-dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather App</title>
    <link rel="stylesheet" href="/style/">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
     rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous">


  </head>
<div style="background-color: #383E42; border-radius: 15px; height: 600px; padding-bottom: 15px; box-shadow: 2px 2px 25px black;"> 

  <body class="text-white bg-dark">

<div class="text-center">
  
    <h1 style="text-shadow: 2px 5px 20px #000; font-family: poppins; padding-bottom: 10px; padding-top: 10px; " class="mt-4">Get Weather İnfo</h1>

    <form action="/" method="post">
      <input class="m-3"
       style="border-radius: 5px;
       padding: 5px;
        font-size: 25px;
         font-family: Inter;
          box-shadow: 2px 2px 10px;"
           type="text" id="city_name" name="cityName" placeholder="Enter City:">


      <input class="m-3"
       style="border-radius:     
        5px; font-size: 25px;
        padding: 5px;
         font-family: Inter;
          box-shadow: 2px 2px 10px;"
           type="text" id="state_name" name="stateName" placeholder="Enter State:">


      <input class="m-3"
       style="border-radius: 5px;
       padding: 5px;
        font-size: 25px;
         font-family: Inter;
          box-shadow: 2px 5px 10px;"
           type="text" id="country_name" name="countryName" placeholder="Enter Country:">


      <button class="m-1"
       style="border-radius: 5px;
        font-size: 25px;
         font-family: Google Sans;
          font-weight: bold;
           padding: 10px; box-shadow: 2px 5px 20px;"
            class="mt-4">Get İnfo</button>
      <br>
    </form>


{% if data %}
<div class="card bg-dark text-white mx-auto mt-4"
 style="width: 20rem; height: 20.5rem;
 text-shadow: 2px 5px 20px #000;
 box-shadow: 5px 5px 20px #080808;">
    <img
        src="https://openweathermap.org/img/wn/{{ data.icon }}@2x.png"
        class="card-img-top"
        alt="Hava Durumu Görseli"
        style="width: 125px; margin: 10px auto;"
    >
    <div class="card-body text-center">
        <h1 class="card-title">{{ data.temperature }} °C</h1>
        <h3 class="card-text">{{ data.main }}</h3>
        <h5 class="card-text">{{ data.description }}</h5>
    </div>
</div>
</div>
{% endif %}


<footer style=" padding-bottom: 50px; padding-top: 300px;">
  <div style="text-align: center; 
  background-color: #383E42;
  border-radius: 15px;
  padding: 15px;
  text-shadow: 2px 5px 20px #000;">

  <h1 style="padding-top: 2px;">MY Weather App | AED</h1>
  <h2 class="mt-6" style="text-align: center;">Credit:<a style="text-decoration: none;" href="https://www.youtube.com/@datagy"> YouTube Datagy</h2></a>
  <h2 class="mt-6" style="text-align: center; margin-left: 2px;">API KEY:<a style="text-decoration: none;" href="https://openweathermap.org/api"> OpenWeatherMap</h2></a>
  <h2 class="mt-6" style="text-align: center;">HTML and CSS:<a style="text-decoration: none;" href="https://www.instagram.com/eymndld/"> Eymndld</h2></a>
  <p style="margin-top: 25px;">&#169; 2026 Weather App | All rights Reserved (Not reserved)</p>
  <p style="margin-top: 10px; font-family: 'Times New Roman', Times, serif;">16.10.2026</p>
</div>
</footer>

  </body>
</html>
